<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Reports | GlassEntials Accounts</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=3">
    
    <style>
        :root {
            --primary-color: #1a2f4a;
            --accent-gold: #d4af37;
            --gold: #d4af37;
            --bg-color: #fdfcf9;
            --border: rgba(13, 27, 42, 0.12);
            --text-main: #0d1b2a;
            --text-muted: #6e7985;
            --radius: 12px;
        }

        body.dashboard-page {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* ── Wrapper ───────────────────────────────────────── */
        .inv-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 24px 60px;
        }

        /* ── Header ────────────────────────────────────────── */
        .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
        }
        .inv-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 0 6px 0;
            letter-spacing: -0.01em;
        }
        .inv-subtitle {
            font-size: 14.5px;
            color: var(--text-muted);
            margin: 0;
            font-weight: 400;
        }

        /* ── Filter Card ───────────────────────────────────── */
        .inv-section {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 24px;
            padding: 24px 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .inv-section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-row {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: var(--text-main);
            background: #fdfcf9;
            min-width: 150px;
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .filter-select:hover, .filter-select:focus {
            border-color: var(--accent-gold);
            background: #fff;
        }

        /* ── Buttons ───────────────────────────────────────── */
        .btn-gold {
            background: var(--accent-gold);
            color: #fff;
            border: none;
            padding: 11px 24px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.25);
        }
        .btn-gold:hover {
            background: #c3a032;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(212, 175, 55, 0.3);
        }
        .btn-gold:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 11px 24px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(26, 47, 74, 0.2);
        }
        .btn-primary:hover {
            background: #112033;
            transform: translateY(-1px);
        }

        /* ── Summary Cards ─────────────────────────────────── */
        .sum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .sum-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }
        .sum-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0; width: 4px;
            background: var(--card-color, var(--primary-color));
            border-radius: 4px 0 0 4px;
        }
        .sum-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sum-val {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin: 6px 0 4px;
        }
        .sum-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ── Tabs ──────────────────────────────────────────── */
        .gst-tabs-nav {
            display: flex;
            gap: 0;
            overflow-x: auto;
            border-bottom: 1.5px solid var(--border);
            margin-bottom: 20px;
        }
        .gst-tab-btn {
            padding: 12px 18px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-muted);
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1.5px;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: inherit;
        }
        .gst-tab-btn:hover {
            color: var(--primary-color);
        }
        .gst-tab-btn.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }
        .gst-tab-panel { display: none; }
        .gst-tab-panel.active { display: block; animation: fadeIn 0.3s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Table ─────────────────────────────────────────── */
        .inv-table-wrap {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-x: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .inv-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }
        .inv-table thead th {
            background: #fafafa;
            padding: 14px 18px;
            text-align: left;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .inv-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .inv-table tbody tr:hover {
            background: #fcfbfa;
        }
        .inv-table tbody td {
            padding: 12px 18px;
            color: var(--text-main);
            vertical-align: middle;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 14.5px;
        }
        .empty-state svg {
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* ── Loader ────────────────────────────────────────── */
        .gst-loader {
            display: none;
            text-align: center;
            padding: 60px;
            color: var(--primary-color);
            font-weight: 500;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(26,47,74,0.1);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body class="dashboard-page">

    {% include 'includes/navbar.html' %}

    <main class="container">
        <div class="inv-wrapper">
            
            <!-- Page Header -->
            <div class="inv-header">
                <div>
                    <h1 class="inv-title">GST Reports</h1>
                    <p class="inv-subtitle">Generate GSTR-1 reports from your invoice data</p>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="inv-section">
                <div class="inv-section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                    Filter Report
                </div>
                
                <form id="gst-filter-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="filter-row">
                        <div class="filter-group">
                            <label>Report Type</label>
                            <select id="report-type" name="report_type" class="filter-select" onchange="toggleFilterMode()">
                                <option value="monthly">Monthly</option>
                                <option value="fy">Financial Year</option>
                            </select>
                        </div>

                        <!-- Monthly filters -->
                        <div class="filter-group" id="monthly-filters">
                            <label>Year</label>
                            <select name="year" id="year-select" class="filter-select">
                                {% for y in years %}
                                <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="filter-group" id="month-filter">
                            <label>Month</label>
                            <select name="month" id="month-select" class="filter-select">
                                {% for num, name in months %}
                                <option value="{{ num }}" {% if num == current_month %}selected{% endif %}>{{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- FY filter -->
                        <div class="filter-group" id="fy-filter" style="display:none;">
                            <label>Financial Year</label>
                            <select name="fy_year" id="fy-select" class="filter-select">
                                {% for yr, label in fy_years %}
                                <option value="{{ yr }}" {% if yr == current_year - 1 %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div style="display:flex; gap:12px; margin-left:auto;">
                            <button type="button" class="btn-primary" onclick="generateReport()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                                Generate Report
                            </button>
                            <button type="submit" id="btn-export" class="btn-gold" disabled form="export-form">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                Export Excel
                            </button>
                        </div>
                    </div>
                </form>
                
                <!-- Hidden export form -->
                <form id="export-form" method="POST" action="{{ url_for('gst_reports.export_excel') }}" style="display:none;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="report_type" id="ef-type">
                    <input type="hidden" name="year" id="ef-year">
                    <input type="hidden" name="month" id="ef-month">
                    <input type="hidden" name="fy_year" id="ef-fy">
                </form>
            </div>

            <!-- Loader -->
            <div class="gst-loader" id="gst-loader">
                <div class="spinner"></div>
                <p>Generating report from invoice data…</p>
            </div>

            <!-- Results -->
            <div id="gst-results" style="display:none;">
                
                <!-- Summary cards -->
                <div class="sum-grid" id="summary-cards"></div>

                <!-- Tabs & Tables -->
                <div class="gst-tabs-nav" role="tablist">
                    <button class="gst-tab-btn active" onclick="switchTab('b2b')" id="tab-btn-b2b">B2B / SEZ / DE</button>
                    <button class="gst-tab-btn" onclick="switchTab('b2cl')" id="tab-btn-b2cl">B2CL</button>
                    <button class="gst-tab-btn" onclick="switchTab('b2cs')" id="tab-btn-b2cs">B2CS</button>
                    <button class="gst-tab-btn" onclick="switchTab('cdnr')" id="tab-btn-cdnr">CDNR</button>
                    <button class="gst-tab-btn" onclick="switchTab('cdnur')" id="tab-btn-cdnur">CDNUR</button>
                    <button class="gst-tab-btn" onclick="switchTab('exp')" id="tab-btn-exp">EXP</button>
                    <button class="gst-tab-btn" onclick="switchTab('exemp')" id="tab-btn-exemp">EXEMP</button>
                    <button class="gst-tab-btn" onclick="switchTab('hsn_b2b')" id="tab-btn-hsn_b2b">HSN (B2B)</button>
                    <button class="gst-tab-btn" onclick="switchTab('hsn_b2c')" id="tab-btn-hsn_b2c">HSN (B2C)</button>
                    <button class="gst-tab-btn" onclick="switchTab('docs')" id="tab-btn-docs">DOCS</button>
                    <button class="gst-tab-btn" onclick="switchTab('cancelled')" id="tab-btn-cancelled" style="color:var(--text-muted);">Cancelled</button>
                </div>

                <div class="gst-tab-panel active" id="panel-b2b"></div>
                <div class="gst-tab-panel" id="panel-b2cl"></div>
                <div class="gst-tab-panel" id="panel-b2cs"></div>
                <div class="gst-tab-panel" id="panel-cdnr"></div>
                <div class="gst-tab-panel" id="panel-cdnur"></div>
                <div class="gst-tab-panel" id="panel-exp"></div>
                <div class="gst-tab-panel" id="panel-exemp"></div>
                <div class="gst-tab-panel" id="panel-hsn_b2b"></div>
                <div class="gst-tab-panel" id="panel-hsn_b2c"></div>
                <div class="gst-tab-panel" id="panel-docs"></div>
                <div class="gst-tab-panel" id="panel-cancelled"></div>

            </div>
        </div>
    </main>

<script>
    const GENERATE_URL = "{{ url_for('gst_reports.generate_report') }}";
    let currentReport = null;
    let currentActiveTab = "b2b";

    function toggleFilterMode() {
        const type = document.getElementById("report-type").value;
        const monthly = document.getElementById("monthly-filters");
        const monthEl = document.getElementById("month-filter");
        const fy = document.getElementById("fy-filter");
        if (type === "fy") {
            monthly.style.display = "none";
            monthEl.style.display = "none";
            fy.style.display = "";
        } else {
            monthly.style.display = "";
            monthEl.style.display = "";
            fy.style.display = "none";
        }
    }

    function switchTab(tab) {
        document.querySelectorAll(".gst-tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".gst-tab-panel").forEach(p => p.classList.remove("active"));
        document.getElementById("tab-btn-" + tab).classList.add("active");
        document.getElementById("panel-" + tab).classList.add("active");
        currentActiveTab = tab;
    }

    function renderTable(rows) {
        if (!rows || rows.length === 0) {
            return `
            <div class="inv-table-wrap">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                    <br>No data available for this period.
                </div>
            </div>`;
        }
        const headers = Object.keys(rows[0]);
        let html = `<div class="inv-table-wrap"><table class="inv-table"><thead><tr>`;
        headers.forEach(h => { html += `<th>${h}</th>`; });
        html += `</tr></thead><tbody>`;
        rows.forEach(row => {
            html += `<tr>`;
            headers.forEach(h => { html += `<td>${row[h] ?? ""}</td>`; });
            html += `</tr>`;
        });
        html += `</tbody></table></div>`;
        return html;
    }

    function fmtCurrency(v) {
        return "₹" + parseFloat(v || 0).toLocaleString("en-IN", { minimumFractionDigits: 2 });
    }

    async function generateReport() {
        const form = document.getElementById("gst-filter-form");
        const fd = new FormData(form);

        document.getElementById("gst-loader").style.display = "block";
        document.getElementById("gst-results").style.display = "none";

        try {
            const res = await fetch(GENERATE_URL, { method: "POST", body: fd });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || "Generation failed");

            currentReport = data.report;
            renderResults(currentReport);
            syncExportForm(fd);
            document.getElementById("btn-export").disabled = false;
        } catch (e) {
            alert("Error generating report: " + e.message);
        } finally {
            document.getElementById("gst-loader").style.display = "none";
        }
    }

    function renderResults(report) {
        const s = report.summary;
        const cardsHTML = `
            <div class="sum-card" style="--card-color: var(--primary-color);">
                <div class="sum-label">Total Invoices</div>
                <div class="sum-val">${s.total_invoices}</div>
                <div class="sum-sub">${s.period_label || 'Valid invoices'}</div>
            </div>
            <div class="sum-card" style="--card-color: #3b82f6;">
                <div class="sum-label">Total Taxable Value</div>
                <div class="sum-val">${fmtCurrency(s.total_taxable)}</div>
                <div class="sum-sub">Pre-tax subtotal</div>
            </div>
            <div class="sum-card" style="--card-color: var(--accent-gold);">
                <div class="sum-label">Total GST Amount</div>
                <div class="sum-val">${fmtCurrency(s.total_gst)}</div>
                <div class="sum-sub">CGST + SGST + IGST</div>
            </div>
            <div class="sum-card" style="--card-color: #10b981;">
                <div class="sum-label">Total Invoice Value</div>
                <div class="sum-val">${fmtCurrency(s.total_invoice_value)}</div>
                <div class="sum-sub">Including GST</div>
            </div>
        `;
        document.getElementById("summary-cards").innerHTML = cardsHTML;

        const tabMap = {
            b2b: report.b2b, b2cl: report.b2cl, b2cs: report.b2cs,
            cdnr: report.cdnr, cdnur: report.cdnur, exp: report.exp,
            exemp: report.exemp, hsn_b2b: report.hsn_b2b, hsn_b2c: report.hsn_b2c,
            docs: report.docs, cancelled: report.cancelled,
        };
        Object.entries(tabMap).forEach(([key, rows]) => {
            document.getElementById("panel-" + key).innerHTML = renderTable(rows);
        });

        document.getElementById("gst-results").style.display = "block";
        switchTab(currentActiveTab);
    }

    function syncExportForm(fd) {
        document.getElementById("ef-type").value = fd.get("report_type") || "monthly";
        document.getElementById("ef-year").value = fd.get("year") || "";
        document.getElementById("ef-month").value = fd.get("month") || "";
        document.getElementById("ef-fy").value = fd.get("fy_year") || "";
    }
</script>
</body>
</html>

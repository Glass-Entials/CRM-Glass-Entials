<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Suspended | GlassEntials</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=3">
    <style>
        .error-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.05) 0%, transparent 70%), var(--bg-tertiary);
            padding: 2rem;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 1rem;
            font-family: var(--font-heading);
            position: relative;
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-message {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 600px;
        }
        .btn-home {
            padding: 1rem 2.5rem;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(13, 27, 42, 0.1);
        }
    </style>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo2.png') }}">
</head>
<body class="dashboard-page">
    <div class="error-container">
        <div class="error-code">⚠️<br>Account Suspended</div>
        <h2 style="font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 1rem;">{{ org.name }}</h2>
        <p class="error-message">
            This organization's account has been suspended. You cannot access the CRM or its data at this time.
            <br><br>
            Please contact GlassEntials support or your organization's owner for further assistance.
        </p>
        <div style="display: flex; gap: 15px;">
            <a href="{{ url_for('org.organization_settings') }}" class="btn-action outline" style="border-color: var(--primary-color); color: var(--primary-color);">Switch Organization</a>
            <form action="{{ url_for('auth.logout') }}" method="POST" style="margin: 0; padding: 0;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn-action gold btn-home">Logout</button>
            </form>
        </div>
    </div>
</body>
</html>

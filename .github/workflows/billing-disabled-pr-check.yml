name: Billing-disabled PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/production-crm-with-billing-disabled]

permissions:
  contents: read

jobs:
  billing-disabled-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      FLASK_ENV: testing
      DATABASE_URL: sqlite:///ci.db
      USE_AWS_SECRETS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run billing-disabled regression tests
        run: python -m unittest discover -s tests -p "test_billing_disabled_mode.py" -v

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login | GlassEntials</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Fonts from CRM -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <!-- CRM Stylesheets -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=3">
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo2.png') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <a href="#" class="logo-link">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="GlassEntials Logo" class="site-logo">
                </a>
                <span class="crm-badge" style="background-color: var(--accent-gold); color: white;">Super Admin</span>
            </div>
            <h2>Admin Portal</h2>
            <p>Secure login for platform administration</p>
        </div>

        {% if error %}
            <div class="flash-message flash-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('super_admin.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter super admin username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter super admin password" required>
            </div>
            
            <button type="submit" class="auth-btn">Verify Credentials</button>
        </form>

        <div class="auth-footer" style="margin-top: 1.5rem;">
            <p style="font-size: 0.8rem; color: var(--text-muted);">Restricted Area. Unauthorized access is prohibited.</p>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.querySelectorAll('.flash-message').forEach(el => {
                el.style.transition = 'opacity 0.5s ease';
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 500);
            });
        }, 3000);
    </script>
</body>
</html>
